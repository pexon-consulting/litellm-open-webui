# OpenAI API with European data residency
# - Host eu.api.openai.com: regional storage and processing in the EEA and Switzerland.
# - Not self-service: needs sales eligibility, Modified Abuse Monitoring or Zero Data Retention,
#   and a Modified Retention amendment. A normal API key gets errors on this host.
# - Models released on or after 5 Mar 2026 cost 10% more via EU residency.
# - System data (e.g. account data) is excluded from residency.
# Source: https://platform.openai.com/docs/guides/your-data (seen 2026-10-16)
# .env: OPENAI_EU_API_KEY (key of the EU residency project)

# Before you copy this file over litellm/models.yaml:
# - Update router_settings.fallbacks in litellm/config.yaml. It names mistral-medium and
#   mistral-small, which do not exist in this file.
# - Open WebUI needs a model called "embedding" for document search (see below).
# - Run .venv/bin/pytest tests/test_config_files.py before you restart LiteLLM.

model_list:
  - model_name: gpt-5.6
    litellm_params:
      model: openai/gpt-5.6-terra
      api_base: https://eu.api.openai.com/v1
      api_key: os.environ/OPENAI_EU_API_KEY
      # USD per token: list price x 1.1 for EU residency (as of 2026-10-16)
      input_cost_per_token: 0.0000022
      output_cost_per_token: 0.0000132

  # Embedding model for Open WebUI document search. Uncomment it, or document upload fails.
  # Not tested in this repo. Add the price (list price x 1.1 where EU residency costs more).
  # - model_name: embedding
  #   litellm_params:
  #     model: openai/text-embedding-3-small
  #     api_base: https://eu.api.openai.com/v1
  #     api_key: os.environ/OPENAI_EU_API_KEY
  #   model_info:
  #     mode: embedding
