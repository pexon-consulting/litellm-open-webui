# Optional: mask personal data (names, e-mail, phone, IBAN, ...) before it reaches the model.
# docker compose -f compose.yaml -f compose.pii.yaml up -d
# See docs/pii-masking.md for languages and limits.

services:
  presidio-analyzer:
    # Official image plus the German spaCy model and recognizers (presidio/Dockerfile)
    build: ./presidio
    image: llm-gateway/presidio-analyzer-de:2.2.362
    environment:
      # gunicorn 25.1.0 can deadlock at start when its control socket is on
      # (https://github.com/benoitc/gunicorn/discussions/3530): worker never boots.
      GUNICORN_CMD_ARGS: --no-control-socket
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:2.2.362
    environment:
      # gunicorn 25.1.0 can deadlock at start when its control socket is on
      # (https://github.com/benoitc/gunicorn/discussions/3530): worker never boots.
      GUNICORN_CMD_ARGS: --no-control-socket
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  litellm:
    environment:
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
    volumes:
      - ./litellm/guardrails.pii.yaml:/app/guardrails.yaml:ro
    depends_on:
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
